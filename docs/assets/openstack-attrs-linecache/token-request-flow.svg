<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="title desc">
  <title id="title">Keystone 토큰 발급과 입력 검사의 처리 순서</title>
  <desc id="desc">JSON 인증 요청을 받은 worker가 스키마 검사 도구를 준비. jsonschema가 Validator 클래스를 만들고 attrs가 보조 메서드 소스를 생성·보관. 입력 검사 후 사용자 인증과 토큰 발급.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#2563eb"/></marker></defs>
  <rect x="1" y="1" width="558" height="648" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <g font-family="Pretendard, Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#1e293b">
    <g fill="#fff" stroke="#0b1f3a"><rect x="35" y="24" width="490" height="80" rx="8"/><rect x="35" y="144" width="490" height="88" rx="8"/><rect x="35" y="272" width="490" height="88" rx="8"/><rect x="35" y="538" width="490" height="88" rx="8"/></g>
    <rect x="35" y="400" width="490" height="98" rx="8" fill="#fff" stroke="#0b1f3a"/>
    <g font-size="23" font-weight="600"><text x="280" y="56">① 토큰 발급 요청</text><text x="280" y="178">② Keystone worker에서 JSON 읽기</text><text x="280" y="306">③ 입력 검사 도구 준비</text><text x="280" y="436">④ attrs가 보조 메서드 소스 생성</text><text x="280" y="572">⑤ 입력 검사 → 인증 → 토큰 발급</text></g>
    <g font-size="21" fill="#3d4d63"><text x="280" y="87">POST /v3/auth/tokens · 인증 정보</text><text x="280" y="213">요청을 받은 worker 하나에서 처리</text><text x="280" y="342">jsonschema: 새 Validator 클래스 생성</text><text x="280" y="476">__init__ · __eq__ → linecache 보관</text><text x="280" y="607">발급받은 토큰으로 Nova API 호출 가능</text></g>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"><path d="M280 104V131"/><path d="M280 232V259"/><path d="M280 360V387"/><path d="M280 498V525"/></g>
</svg>
