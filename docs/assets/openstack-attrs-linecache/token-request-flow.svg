<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
  <title id="title">인증에서 하이퍼바이저 조회까지의 요청 순서</title>
  <desc id="desc">CLI가 Keystone에 JSON 인증 정보를 전달. Keystone worker가 입력 검사와 사용자 인증 후 토큰 발급. 발급된 토큰으로 Nova API의 하이퍼바이저 목록 조회.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#2563eb"/></marker></defs>
  <rect x="1" y="1" width="558" height="438" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <g font-family="Pretendard, Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#1e293b">
    <g fill="#fff" stroke="#0b1f3a">
      <rect x="35" y="24" width="490" height="76" rx="8"/>
      <rect x="35" y="132" width="490" height="76" rx="8"/>
      <rect x="35" y="240" width="490" height="76" rx="8"/>
      <rect x="35" y="348" width="490" height="68" rx="8"/>
    </g>
    <g font-size="23" font-weight="600">
      <text x="280" y="54">① Keystone에 토큰 발급 요청</text>
      <text x="280" y="162">② worker에서 입력 검사</text>
      <text x="280" y="270">③ 사용자 인증 · 토큰 발급</text>
      <text x="280" y="389">④ Nova API에서 목록 조회</text>
    </g>
    <g font-size="21" fill="#3d4d63">
      <text x="280" y="84">POST /v3/auth/tokens · JSON 인증 정보</text>
      <text x="280" y="192">JSON을 읽고 스키마 규칙 확인</text>
      <text x="280" y="300">발급된 토큰을 다음 API 요청에 사용</text>
    </g>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"><path d="M280 100V119"/><path d="M280 208V227"/><path d="M280 316V335"/></g>
</svg>
