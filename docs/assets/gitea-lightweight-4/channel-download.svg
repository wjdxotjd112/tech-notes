<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="title desc">
  <title id="title">고정 채널 주소로 패키지 다운로드</title>
  <desc id="desc">사업수행팀이 current 또는 계열 채널을 요청하면 HAProxy가 map을 조회해 실제 Nexus 버전 경로로 302 응답한다. 클라이언트는 안내한 경로에서 TAR를 한 번 다운로드한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
  <rect width="360" height="350" rx="12" fill="#f8fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif" text-anchor="middle" fill="#1e293b">
    <g fill="#fff" stroke="#0b1f3a" stroke-width="1.5"><rect x="22" y="20" width="316" height="76" rx="9"/><rect x="22" y="137" width="316" height="76" rx="9"/><rect x="22" y="254" width="316" height="76" rx="9"/></g>
    <text x="180" y="50" font-size="22" font-weight="700">사업수행팀 · 고정 주소</text><text x="180" y="77" font-size="18" fill="#3d4d63">channels/current 또는 4.1</text>
    <text x="180" y="167" font-size="22" font-weight="700">HAProxy · map 조회</text><text x="180" y="194" font-size="18" fill="#3d4d63">버전별 실제 URL 안내</text>
    <text x="180" y="284" font-size="22" font-weight="700">Nexus · 실제 TAR</text><text x="180" y="311" font-size="18" fill="#3d4d63">releases/4.1/v4.1.2/…</text>
    <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 98V129"/><path d="M180 215V246"/></g>
    <text x="260" y="121" font-size="17" fill="#2563eb">고정 URL 요청</text><text x="265" y="238" font-size="17" fill="#2563eb">302 따라 요청</text>
  </g>
</svg>
