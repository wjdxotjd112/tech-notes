global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    stats socket "${RELEASE_SOCKET}" mode 660 level admin
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout http-request 15s
    timeout http-keep-alive 10s

frontend release_https
    bind ":${RELEASE_HTTPS_PORT}" ssl crt "${GITEA_CERT_DIR}/gitea.pem"
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header Referrer-Policy no-referrer
    http-request redirect code 302 location "%[path,map_str(${RELEASE_MAP_FILE})]" ignore-empty
    http-request return status 404 if { path_beg "/repository/${MANIFEST_REPOSITORY}/channels/" } { path_end /contrabass-engine-deploy.tar }
    default_backend nexus_https

backend nexus_https
    option httpchk GET /service/rest/v1/status
    http-check expect status 200
    server nexus "127.0.0.1:${NEXUS_HTTPS_PORT}" ssl verify none check
