services:
  nexus:
    image: ${NEXUS_IMAGE:?Set NEXUS_IMAGE in .env}
    container_name: nexus
    hostname: nexus
    restart: unless-stopped

    ports:
      - "${NEXUS_HTTPS_PORT}:55555"

    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms${NEXUS_HEAP}
        -Xmx${NEXUS_HEAP}
        -XX:MaxDirectMemorySize=${NEXUS_DIRECT_MEMORY}
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
        -Duser.timezone=${TZ}

    volumes:
      - ${NEXUS_DATA_DIR}:/nexus-data

    ulimits:
      nofile:
        soft: 65536
        hard: 65536


    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge
