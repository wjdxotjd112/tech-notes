services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/gitea-db-password
      TZ: ${TZ}
    volumes:
      - ${GITEA_DB_DATA_DIR}:/var/lib/postgresql/data
      - ./secrets/gitea-db-password:/run/secrets/gitea-db-password:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    networks: [gitea-net]

  gitea:
    image: ${GITEA_IMAGE:?Set GITEA_IMAGE in .env}
    container_name: gitea
    restart: unless-stopped
    depends_on: [db]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: ${TZ}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD__FILE: /run/secrets/gitea-db-password
      GITEA__server__PROTOCOL: https
      GITEA__server__DOMAIN: ${SERVER_HOST}
      GITEA__server__ROOT_URL: https://${SERVER_HOST}:${GITEA_HTTPS_PORT}/
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: "30000"
      GITEA__server__SSH_DOMAIN: ${SERVER_HOST}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__CERT_FILE: /opt/certs/gitea.crt
      GITEA__server__KEY_FILE: /opt/certs/gitea.key
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
      GITEA__session__COOKIE_SECURE: "true"
      GITEA__session__SAME_SITE: lax
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,::1/128
      GITEA__security__DISABLE_GIT_HOOKS: "true"
    volumes:
      - ${GITEA_DATA_DIR}:/data
      - ${GITEA_CERT_DIR}:/opt/certs:ro
      - ./secrets/gitea-db-password:/run/secrets/gitea-db-password:ro
    ports:
      - "${GITEA_HTTPS_PORT}:30000"
      - "${GITEA_SSH_PORT}:22"
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    networks: [gitea-net]

networks:
  gitea-net:
    driver: bridge
