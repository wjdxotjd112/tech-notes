services:
  nexus:
    image: ${NEXUS_IMAGE:?Set NEXUS_IMAGE from manifest.yaml}
    container_name: nexus
    hostname: nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-55555}:${NEXUS_PORT:-55555}"
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms${NEXUS_HEAP:-2703m}
        -Xmx${NEXUS_HEAP:-2703m}
        -XX:MaxDirectMemorySize=${NEXUS_DIRECT_MEMORY:-2703m}
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
        -Duser.timezone=Asia/Seoul
    volumes:
      - ${NEXUS_DATA:-/opt/nexus/nexus-data}:/nexus-data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge
