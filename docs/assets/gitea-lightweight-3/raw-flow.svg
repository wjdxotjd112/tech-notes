<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="title desc">
  <title id="title">일반 파일의 Nexus 이관</title>
  <desc id="desc">개발자가 일반 파일을 Raw Repository에 업로드하고, Ansible의 get_url로 배포 대상 노드가 파일을 받는다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
  <rect width="360" height="350" rx="12" fill="#f8fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif" text-anchor="middle" fill="#1e293b">
    <g fill="#fff" stroke="#0b1f3a" stroke-width="1.5"><rect x="22" y="20" width="316" height="76" rx="9"/><rect x="22" y="137" width="316" height="76" rx="9"/><rect x="22" y="254" width="316" height="76" rx="9"/></g>
    <text x="180" y="50" font-size="21" font-weight="700">프로그램·바이너리·QCOW2</text><text x="180" y="77" font-size="18" fill="#3d4d63">원본 파일 형태 유지</text>
    <text x="180" y="167" font-size="22" font-weight="700">Nexus · raw-hosted</text><text x="180" y="194" font-size="18" fill="#3d4d63">용도·버전별 경로</text>
    <text x="180" y="284" font-size="22" font-weight="700">배포 대상 노드</text><text x="180" y="311" font-size="18" fill="#3d4d63">파일 다운로드 → 설치</text>
    <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 98V129"/><path d="M180 215V246"/></g>
    <text x="255" y="121" font-size="17" fill="#2563eb">업로드</text><text x="265" y="238" font-size="17" fill="#2563eb">get_url</text>
  </g>
</svg>
