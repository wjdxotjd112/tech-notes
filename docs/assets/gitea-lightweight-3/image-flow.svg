<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="title desc">
  <title id="title">컨테이너 이미지의 Nexus 이관</title>
  <desc id="desc">개발자가 이미지 TAR를 load하고 이름을 지정해 Docker Repository에 push한다. 컨테이너 런타임은 해당 주소에서 이미지를 pull한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
  <rect width="360" height="350" rx="12" fill="#f8fafc"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif" text-anchor="middle" fill="#1e293b">
    <g fill="#fff" stroke="#0b1f3a" stroke-width="1.5"><rect x="22" y="20" width="316" height="76" rx="9"/><rect x="22" y="137" width="316" height="76" rx="9"/><rect x="22" y="254" width="316" height="76" rx="9"/></g>
    <text x="180" y="50" font-size="22" font-weight="700">컨테이너 이미지 TAR</text><text x="180" y="77" font-size="18" fill="#3d4d63">load → tag</text>
    <text x="180" y="167" font-size="22" font-weight="700">Nexus · docker-hosted</text><text x="180" y="194" font-size="18" fill="#3d4d63">이미지 이름:태그</text>
    <text x="180" y="284" font-size="22" font-weight="700">컨테이너 런타임</text><text x="180" y="311" font-size="18" fill="#3d4d63">이미지 pull → 실행</text>
    <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 98V129"/><path d="M180 215V246"/></g>
    <text x="255" y="121" font-size="17" fill="#2563eb">push</text><text x="255" y="238" font-size="17" fill="#2563eb">pull</text>
  </g>
</svg>
