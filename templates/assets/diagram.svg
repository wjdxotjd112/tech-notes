<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title description">
  <title id="title">요청 처리 순서 — 개념도</title>
  <desc id="description">요청 수신, 데이터 검증, 응답 반환 순서. 실제 호출 추적 결과가 아닌 수정용 예제.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="258" fill="#eff5ff" stroke="#0b1f3a"/>
  <g font-family="Pretendard, Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#1e293b">
    <text x="32" y="42" font-size="20" font-weight="600">요청 처리 순서</text>
    <g fill="#fff" stroke="#0b1f3a" stroke-width="1">
      <rect x="32" y="82" width="230" height="78" rx="4"/>
      <rect x="335" y="82" width="230" height="78" rx="4"/>
      <rect x="638" y="82" width="230" height="78" rx="4"/>
    </g>
    <g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 276 121 H 319"/>
      <path d="M 579 121 H 622"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="600">
      <text x="147" y="128">요청 수신</text>
      <text x="450" y="128">데이터 검증</text>
      <text x="753" y="128">응답 반환</text>
    </g>
    <g fill="#3d4d63" font-size="16">
      <text x="32" y="206">실선 화살표: 처리 순서</text>
      <text x="32" y="234">개념도 예제. 실제 호출 추적 결과는 아님.</text>
    </g>
  </g>
</svg>
